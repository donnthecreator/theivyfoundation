[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/db/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/gs"
  to = "/gs.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/staff.html"
  status = 200
